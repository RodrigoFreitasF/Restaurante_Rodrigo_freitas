name: integracao continua

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop", "staging"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para o Sonar ler o histórico de branches

      - name: Criar sonar-project.properties dinâmico
        run: |
          # Define o nome do repo e a branch dinamicamente
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.TOKENSONAR}}

          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          # Reforça a branch nos argumentos da execução
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_merge_staging:
    needs: job_sonar
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # O GITHUB_TOKEN padrão não dispara novos workflows por segurança. 
          # Se o deploy da staging não iniciar, será necessário criar um PAT (Personal Access Token).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git e fazer Merge para Staging
        run: |
          git config --global user.name "GitHub Actions Automator"
          git config --global user.email "actions@github.com"
          
          # Garante que a branch staging exista localmente e esteja atualizada
          git checkout -B staging origin/staging || git checkout -b staging
          
          # Traz as atualizações da develop e mescla
          git merge origin/develop --no-edit
          
          # Envia a nova staging para o repositório
          git push origin staging

  job_release_docker:
    needs: [estagio_lint, job_sonar]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Registry (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          # Se usar outro registry (AWS ECR, GitHub CR, etc), adicione a chave 'registry:' aqui

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas:${{ github.ref_name }}
          # Troque "nome-do-seu-app" para o nome do seu repositório no Docker Hub

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas:${{ github.ref_name }}'
          format: 'sarif'
          output: 'trivy-report.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: SonarQube lendo o Trivy (External Issues)
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.TOKENSONAR }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.sarifReportPaths=trivy-report.sarif

  job_deploy:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose com o identificador
        run: |
          export PORT=9010
          
          # Copia o compose original para o formato fixo
          cp docker-compose.yml docker-compose-rodrigo-staging.yml
          
          # Substitui a instrução de build pela imagem construída
          sed -i "s|build: .|image: \${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas:staging|g" docker-compose-rodrigo-staging.yml
          
          # Renomeia os containers para evitar conflito caso ambos rodem na mesma máquina
          sed -i "s|container_name: restaurante-rodrigo|container_name: restaurante-rodrigo-staging|g" docker-compose-rodrigo-staging.yml
          
          # Modifica a porta exposta da aplicação
          sed -i "s|9010:3000|$PORT:3000|g" docker-compose-rodrigo-staging.yml

      - name: Copiar Compose para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-rodrigo-staging.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/deploy_rodrigo_staging/"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Entra na pasta onde o arquivo foi copiado
            cd /home/${{ secrets.EC2_USER }}/deploy_rodrigo_staging

            # Executa o init.sql no container MySQL antes de subir a aplicação
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql

            echo "✅ init.sql executado com sucesso!"

            # Força o pull da nova imagem e sobe os containers
            sudo docker compose -f docker-compose-rodrigo-staging.yml pull
            sudo docker compose -f docker-compose-rodrigo-staging.yml up -d

            echo "✅ Deploy do Rodrigo (staging) finalizado com sucesso!"
