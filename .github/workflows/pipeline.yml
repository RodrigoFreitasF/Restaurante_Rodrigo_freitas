name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  # ==========================================
  # ETAPAS EXISTENTES (Completas)
  # ==========================================
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  # ==========================================
  # ESTÁGIO DE TESTES (Executa nas duas branches)
  # ==========================================
  estagio_test:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install

      - name: Rodar Testes de Login
        run: node test_login.js

  # ==========================================
  # JOB DO SONAR (Apenas na develop)
  # ==========================================
  job_sonar:
    needs: [estagio_lint, estagio_test]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para o Sonar ler o histórico de branches

      - name: Criar sonar-project.properties dinâmico
        run: |
          # Define o nome do repo e a branch dinamicamente
          echo "sonar.projectKey=Restaurante_Rodrigo_freitas" > sonar-project.properties
          echo "sonar.projectName=Restaurante_Rodrigo_freitas" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.TOKENSONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          # Reforça a branch nos argumentos da execução
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================
  # JOB DE MERGE AUTOMÁTICO (Apenas na develop)
  # ==========================================
  job_merge_staging:
    needs: job_sonar
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configurar Git e fazer Merge para Staging
        run: |
          git config --global user.name "GitHub Actions Automator"
          git config --global user.email "actions@github.com"
          
          # Garante que a branch staging exista localmente e esteja atualizada
          git checkout -B staging origin/staging || git checkout -b staging
          
          # Traz as atualizações da develop e mescla
          git merge origin/develop --no-edit
          
          # Envia a nova staging para o repositório disparando o CI da staging
          git push origin staging

  # ==========================================
  # ETAPAS DE STAGING (Apenas na staging)
  # ==========================================
  job_release_docker:
    needs: [estagio_lint, estagio_test]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Registry (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tagueia a imagem com a tag fixa 'staging' e a tag única do commit
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          # Escaneia a imagem específica que acabou de ser criada
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-report.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=Restaurante_Rodrigo_freitas" > sonar-project.properties
          echo "sonar.projectName=Restaurante_Rodrigo_freitas" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: SonarQube lendo o Trivy (SARIF)
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.TOKENSONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.sarifReportPaths=trivy-report.sarif
            
  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/restaurante_rodrigo_freitas
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose para o Rodrigo
        run: |
          # Copia o compose original para o formato fixo: docker-compose-rodrigo.yml
          cp docker-compose.yml docker-compose-rodrigo.yml
          
          # Substitui a instrução de build pela imagem do Docker Hub
          sed -i "s|build: .|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|g" docker-compose-rodrigo.yml
          
          # A porta em docker-compose.yml já está mapeada como "9010:3000"

      - name: Copiar Compose para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-rodrigo.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/rodrigo"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Entra na pasta onde o arquivo foi copiado
            cd /home/${{ secrets.EC2_USER }}/rodrigo

            # Executa o init.sql no container MySQL antes de subir a aplicação
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql

            echo "✅ init.sql executado com sucesso!"

            # Força o pull da nova imagem e sobe o container
            sudo docker compose -f docker-compose-rodrigo.yml pull
            sudo docker compose -f docker-compose-rodrigo.yml up -d

            echo "✅ Deploy do Rodrigo na porta 9010 finalizado com sucesso!"
