services:
  app:
    build: .
    container_name: restaurante-rodrigo
    ports:
      - "9010:3000"
    environment:
      DB_HOST: mysql-infra
      DB_USER: root
      DB_PORT: 3306
      DB_PASS: password
      DB_NAME: rodrigoFreiDb
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
    networks:
      - rede_alunos
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rede_alunos:
    external: true
